# Prospective 50-step infrastructure pilot. Do not launch until the private Hub
# ID replaces the local ID and candidate_training_ready is true in the manifest.

model = "Qwen/Qwen3.5-4B"
max_steps = 50
batch_size = 128
rollouts_per_example = 8
oversampling_factor = 2.0

[sampling]
max_tokens = 96
enable_thinking = false

[[env]]
name = "jinn-beast-metta-train"

[env.taskset]
id = "moralitylab/jinn-beast-metta"
split = "candidate_train"
frame = "balanced"
require_training_approval = true

[env.harness]
id = "null"
max_turns = 1

[eval]
interval = 10
num_examples = 40
rollouts_per_example = 1
skip_first_step = false

[[eval.env]]
name = "jinn-beast-metta-development"

[eval.env.taskset]
id = "moralitylab/jinn-beast-metta"
split = "development"
frame = "balanced"
require_training_approval = true

[eval.env.harness]
id = "null"
max_turns = 1
