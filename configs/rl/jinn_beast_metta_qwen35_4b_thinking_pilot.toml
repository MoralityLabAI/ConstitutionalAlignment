# Prospective trace-bearing pilot. Do not launch until
# candidate_training_ready is true in the generated manifest.

model = "Qwen/Qwen3.5-4B"
max_steps = 10
batch_size = 64
rollouts_per_example = 8
oversampling_factor = 2.0

[sampling]
max_tokens = 4096
enable_thinking = true

[[env]]
name = "jinn-beast-metta-thinking-train"

[env.taskset]
id = "moralitylab/jinn-beast-metta"
split = "candidate_train"
frame = "balanced"
require_training_approval = true

[env.harness]
id = "null"
max_turns = 1

[eval]
interval = 5
num_examples = 40
rollouts_per_example = 1
skip_first_step = false

[eval.sampling]
max_tokens = 4096
temperature = 0.0
enable_thinking = true

[[eval.env]]
name = "jinn-beast-metta-thinking-development"

[eval.env.taskset]
id = "moralitylab/jinn-beast-metta"
split = "development"
frame = "balanced"
require_training_approval = true

[eval.env.harness]
id = "null"
max_turns = 1

[checkpoints]
interval = 5
keep_cloud = 2

[adapters]
interval = 5
keep_last = 2
