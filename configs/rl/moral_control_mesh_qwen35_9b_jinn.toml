name = "moral-control-mesh-qwen35-9b-jinn-v1"
model = "Qwen/Qwen3.5-9B"
max_steps = 12
batch_size = 96
rollouts_per_example = 4
max_inflight_rollouts = 4
learning_rate = 1e-4
lora_alpha = 16

[sampling]
max_tokens = 2048
temperature = 0.7
enable_thinking = true
reasoning_effort = "low"

[[env]]
id = "moralitylab/jinn-beast-metta"
name = "moral-control-mesh-jinn-train"
version = "0.1.11"
args = { split = "candidate_train", frame = "jinn", task_mode = "moral_control_mesh", require_training_approval = true }

[eval]
interval = 4
num_examples = -1
rollouts_per_example = 4
skip_first_step = false

[eval.sampling]
max_tokens = 3072
temperature = 0.0
enable_thinking = true
reasoning_effort = "low"

[[eval.env]]
id = "moralitylab/jinn-beast-metta"
name = "moral-control-mesh-jinn-development"
version = "0.1.11"
args = { split = "development", frame = "jinn", task_mode = "moral_control_mesh", require_training_approval = true }

[checkpoints]
interval = 4
keep_cloud = 3

[adapters]
interval = 0
keep_last = 1
