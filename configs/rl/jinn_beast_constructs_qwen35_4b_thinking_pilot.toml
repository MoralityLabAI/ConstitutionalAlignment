# Prospective dual-construct pilot. This config is deliberately fail-closed
# until the candidate storyworld labels and source mappings are approved.

model = "Qwen/Qwen3.5-4B"
max_steps = 10
batch_size = 64
rollouts_per_example = 8
oversampling_factor = 1.0

[sampling]
max_tokens = 6144
enable_thinking = true

[[env]]
name = "jinn-beast-constructs-thinking-train"

[env.taskset]
id = "moralitylab/jinn-beast-metta"
split = "candidate_train"
task_mode = "constructs"
construct = "balanced"
require_training_approval = true

[env.harness]
id = "null"
max_turns = 1

[eval]
interval = 5
num_examples = 4
rollouts_per_example = 4
skip_first_step = false

[eval.sampling]
max_tokens = 6144
temperature = 0.7
enable_thinking = true

[[eval.env]]
name = "jinn-beast-constructs-thinking-development"

[eval.env.taskset]
id = "moralitylab/jinn-beast-metta"
split = "development"
task_mode = "constructs"
construct = "balanced"
require_training_approval = true

[eval.env.harness]
id = "null"
max_turns = 1

[checkpoints]
interval = 5
keep_cloud = 2

[adapters]
interval = 5
keep_last = 2
