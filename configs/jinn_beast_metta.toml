# Install first: uv pip install -e environments/jinn_beast_metta
# Validate only: uv run eval @ configs/jinn_beast_metta.toml --dry-run

model = "Qwen/Qwen3.5-4B"
num_tasks = 20
num_rollouts = 8

[sampling]
temperature = 0.7
max_tokens = 96
enable_thinking = false

[env.taskset]
id = "jinn-beast-metta"
split = "development"
frame = "balanced"
require_training_approval = true

[env.agent]
max_turns = 1

[env.agent.harness]
id = "null"
