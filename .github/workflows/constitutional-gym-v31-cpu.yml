name: Constitutional reasoning gym v3.1 CPU
on:
  push:
    paths:
      - 'experiments/constitutional_reasoning_gym_v3/v31/**'
      - '.github/workflows/constitutional-gym-v31-cpu.yml'
  pull_request:
    paths:
      - 'experiments/constitutional_reasoning_gym_v3/v31/**'
      - '.github/workflows/constitutional-gym-v31-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU dependency install
        run: |
          python -m pip install 'numpy>=1.24,<3' 'gymnasium==1.2.2'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify shell syntax
        run: bash -n experiments/constitutional_reasoning_gym_v3/v31/scripts/silico_v31_repair.sh
      - name: Reproduce all v3 and v3.1 regression tests and receipt
        run: python -m experiments.constitutional_reasoning_gym_v3.v31.verify --out /tmp/ca-v31-evidence
      - name: Upload full synthetic audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: constitutional-gym-v31-cpu-receipts
          path: /tmp/ca-v31-evidence/
