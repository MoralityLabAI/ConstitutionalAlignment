name: Constitutional reasoning gym v3 CPU
on:
  push:
    paths: ['experiments/constitutional_reasoning_gym_v3/**', '.github/workflows/constitutional-gym-v3-cpu.yml']
  pull_request:
    paths: ['experiments/constitutional_reasoning_gym_v3/**', '.github/workflows/constitutional-gym-v3-cpu.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy 'gymnasium==1.2.2'
      - run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - run: bash -n experiments/constitutional_reasoning_gym_v3/scripts/silico_generate.sh
      - run: python -m experiments.constitutional_reasoning_gym_v3.verify --out /tmp/ca-v3-cpu
      - name: Optional Gymnasium checker
        run: |
          python - <<'PY'
          from gymnasium.utils.env_checker import check_env
          from experiments.constitutional_reasoning_gym_v3.env import ConstitutionalReasoningEnv
          check_env(ConstitutionalReasoningEnv(), skip_render_check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ca-v3-cpu-evidence
          path: /tmp/ca-v3-cpu/
