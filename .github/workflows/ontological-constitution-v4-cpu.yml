name: Ontological constitution v4 CPU
on:
  push:
    paths: ['experiments/ontological_constitution_v4/**', '.github/workflows/ontological-constitution-v4-cpu.yml']
  pull_request:
    paths: ['experiments/ontological_constitution_v4/**', '.github/workflows/ontological-constitution-v4-cpu.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m experiments.ontological_constitution_v4 verify --out /tmp/ontology-v4-check
      - name: Check verified receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/ontology-v4-check/cpu_receipt.json'))
          assert r['status']=='CPU_VERIFIED' and r['skipped_total']==0
          committed=json.load(open('experiments/ontological_constitution_v4/results/cpu_receipt.json'))
          assert r['source_sha256']==committed['source_sha256']
          assert r['new_tests']>=99 and r['tests_total']>=232
          assert r['curriculum_records']==320 and r['semantic_groups']==20
          assert r['GPU_jobs']==0 and r['final_test_access'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ontology-v4-cpu-corpus-and-receipts
          path: /tmp/ontology-v4-check/
