name: Constitutional v3.1 semantic audit CPU
on:
  push:
    paths: ['experiments/constitutional_reasoning_gym_v3/semantic_review_v1/**', '.github/workflows/constitutional-semantic-audit-v1-cpu.yml']
  pull_request:
    paths: ['experiments/constitutional_reasoning_gym_v3/semantic_review_v1/**', '.github/workflows/constitutional-semantic-audit-v1-cpu.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-review-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Run all v3 and v3.1 tests, then synthetic QA review fixture
        run: python -m experiments.constitutional_reasoning_gym_v3.semantic_review_v1.verify --out /tmp/ca-v31-semantic-v1
      - uses: actions/upload-artifact@v4
        with:
          name: ca-v31-semantic-v1-cpu-evidence
          path: /tmp/ca-v31-semantic-v1/
