name: Ontological v4 source-aware training CPU
on:
  push:
    paths: ['experiments/ontological_constitution_v4_training/**', '.github/workflows/ontological-v4-training-cpu.yml']
  pull_request:
    paths: ['experiments/ontological_constitution_v4_training/**', '.github/workflows/ontological-v4-training-cpu.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m experiments.ontological_constitution_v4_training verify --out /tmp/v4-training-check
      - name: Check verification
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v4-training-check/cpu_receipt.json'))
          assert r['status']=='CPU_VERIFIED' and r['skipped_total']==0
          assert r['new_tests']>=54 and r['existing_tests']==232
          assert r['admitted_lesson_rows']==320
          assert set(r['tiny_steps_per_arm'].values())=={36}
          assert r['synthetic_assigned_evaluation_records']==384
          assert r['GPU_jobs']==0 and not r['final_test_access']
          committed=json.load(open('experiments/ontological_constitution_v4_training/results/cpu_receipt.json'))
          assert r['source_sha256']==committed['source_sha256']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ontological-v4-training-cpu
          path: /tmp/v4-training-check/
