name: Ontological v4 source-aware trainer CPU
on:
  push:
    paths: ['experiments/ontological_constitution_v4_training/**', '.github/workflows/ontological-v4-training-cpu.yml']
  pull_request:
    paths: ['experiments/ontological_constitution_v4_training/**', '.github/workflows/ontological-v4-training-cpu.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - run: bash -n experiments/ontological_constitution_v4_training/scripts/silico_pair.sh
      - run: python -m experiments.ontological_constitution_v4_training verify --out /tmp/ontology-training-check
      - name: Verify source-bound receipt and CPU-only execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.ontological_constitution_v4_training.admission import implementation_hashes
          expected=json.loads(Path('experiments/ontological_constitution_v4_training/results/cpu_receipt.json').read_text())
          actual=json.loads(Path('/tmp/ontology-training-check/cpu_receipt.json').read_text())
          assert actual['source_sha256']==expected['source_sha256']==implementation_hashes()
          assert actual['tests_total']==expected['tests_total']
          assert actual['skipped_total']==0 and actual['gpu_jobs']==0
          assert actual['student_tokenizer_measurement']=='NOT_RUN_TOKENIZER_NOT_MOUNTED'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ontology-v4-training-cpu-evidence
          path: /tmp/ontology-training-check/
