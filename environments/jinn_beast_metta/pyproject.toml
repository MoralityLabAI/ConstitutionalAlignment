[project]
name = "jinn-beast-metta"
version = "0.1.11"
description = "Verifiers v1 taskset for frame-robust constitutional storyworld decisions."
tags = ["reinforcement-learning", "alignment", "storyworlds", "metta", "qwen"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "verifiers>=0.2.1,<0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jinn_beast_metta"]

[tool.hatch.build]
include = [
  "jinn_beast_metta/*.py",
  "jinn_beast_metta/data/*.json",
  "jinn_beast_metta/data/*.jsonl",
]
