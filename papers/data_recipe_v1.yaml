version: data_recipe_v1
updated: 2026-02-13
# Dataset license/access controls are authoritative in papers/DATA_LICENSES.md.
# Do not download or train on a source until its manifest row is cleared.
# Build every local/evidence corpus under papers/corpus_build_spec_v1.md.
objective: >-
  Constitutional alignment training for three main tracks (ashari, mutazili,
  control_generic)
  using SFT -> self-critique/revision -> preference optimization -> adversarial eval,
  with MCP access isolated as a post-training ablation.

global:
  seed: 42
  max_input_tokens: 2048
  max_output_tokens: 512
  rationale_style: concise_no_cot
  dedup:
    enabled: true
    strategy: exact_and_semantic
  provenance:
    required_fields:
      - sample_id
      - source
      - split
      - transform_version
      - constitution_version
      - track

tracks:
  ashari:
    constitution_version: constitution_ashari_v1
    allowed_evidence:
      - quran_500_wisdom_verses
      - ashari_tafsir_corpus
    mcp:
      enabled: false
      citation_required: false
  mutazili:
    constitution_version: constitution_mutazili_v1
    allowed_evidence:
      - quran_500_wisdom_verses
      - mutazili_tafsir_corpus
    mcp:
      enabled: false
      citation_required: false
  control_generic:
    constitution_version: constitution_control_generic_v1
    allowed_evidence:
      - anthropic_claude_constitution_cc0_snapshot
    mcp:
      enabled: false
      citation_required: false

experimental_design:
  primary_comparison:
    comparator: ashari
    treatment: mutazili
    manipulated_variable: constitutional_treatment
    treatment_definition: constitution_version_and_tradition_tied_evidence_corpus
    held_constant:
      - base_model_and_initialization
      - public_dataset_ids_splits_revisions_and_weights
      - training_stage_structure_and_hyperparameters
      - evaluation_prompts_metrics_and_gates
      - mcp_access_off
  generic_control_comparisons:
    comparator: control_generic
    treatments: [ashari, mutazili]
    manipulated_variable: constitutional_treatment
    treatment_definition: constitution_version_and_constitution_tied_evidence_corpus
    held_constant:
      - base_model_and_initialization
      - public_dataset_ids_splits_revisions_and_weights
      - training_stage_structure_and_hyperparameters
      - evaluation_prompts_metrics_and_gates
      - mcp_access_off
  mcp_ablation:
    base_track: ashari
    checkpoint: same_frozen_post_training_checkpoint
    prompt_set: same_randomized_eval_prompts
    arms:
      mcp_off:
        enabled: false
        citation_required: false
      mcp_on:
        enabled: true
        citation_required: true
        allowed_evidence_addition: fiqh_mcp_outputs
    manipulated_variable: mcp_tool_access

schemas:
  sft_sample:
    input_fields: [prompt, context, dilemma_type]
    output_fields: [judgment_label, concise_justification, recommended_action]
  critique_sample:
    input_fields: [prompt, draft_answer, constitution_version]
    output_fields: [violation_flags, critique, revised_answer]
  preference_pair:
    input_fields: [prompt, response_a, response_b]
    output_fields: [preferred, preference_rationale_short]

stages:
  sft_bootstrap:
    target_steps: 3000
    learning_rate: 2.0e-5
    batch_size: 64
    sources:
      ashari:
        - id: local/constitution_synthetic_ashari
          weight: 0.40
        - id: demelin/moral_stories
          weight: 0.20
        - id: allenai/prosocial-dialog
          weight: 0.15
        - id: allenai/social_i_qa
          weight: 0.15
        - id: allenai/ultrafeedback_binarized_cleaned
          weight: 0.10
      mutazili:
        - id: local/constitution_synthetic_mutazili
          weight: 0.40
        - id: demelin/moral_stories
          weight: 0.20
        - id: allenai/prosocial-dialog
          weight: 0.15
        - id: allenai/social_i_qa
          weight: 0.15
        - id: allenai/ultrafeedback_binarized_cleaned
          weight: 0.10
      control_generic:
        - id: local/constitution_synthetic_control_generic
          weight: 0.40
        - id: demelin/moral_stories
          weight: 0.20
        - id: allenai/prosocial-dialog
          weight: 0.15
        - id: allenai/social_i_qa
          weight: 0.15
        - id: allenai/ultrafeedback_binarized_cleaned
          weight: 0.10
    filters:
      remove_explicit_hate_for_training: true
      language: [en, ar]

  socratic_critique_revision:
    target_steps: 2000
    learning_rate: 1.0e-5
    batch_size: 64
    generation_loop:
      - draft_response
      - constitutional_critique
      - revised_response
      - pairwise_scoring
    sources:
      ashari:
        - id: local/socratic_rollouts_ashari
          weight: 0.70
        - id: allenai/llama-3.1-tulu-3-8b-preference-mixture
          weight: 0.30
      mutazili:
        - id: local/socratic_rollouts_mutazili
          weight: 0.70
        - id: allenai/llama-3.1-tulu-3-8b-preference-mixture
          weight: 0.30
      control_generic:
        - id: local/socratic_rollouts_control_generic
          weight: 0.70
        - id: allenai/llama-3.1-tulu-3-8b-preference-mixture
          weight: 0.30

  preference_optimization:
    algorithm: dpo
    target_steps: 2000
    learning_rate: 5.0e-6
    batch_size: 128
    beta: 0.1
    sources:
      ashari:
        - id: allenai/llama-3.1-tulu-3-8b-preference-mixture
          weight: 0.30
        - id: PKU-Alignment/PKU-SafeRLHF
          weight: 0.30
        - id: allenai/ultrafeedback_binarized_cleaned
          weight: 0.25
        - id: local/constitutional_preference_pairs_ashari
          weight: 0.15
      mutazili:
        - id: allenai/llama-3.1-tulu-3-8b-preference-mixture
          weight: 0.30
        - id: PKU-Alignment/PKU-SafeRLHF
          weight: 0.30
        - id: allenai/ultrafeedback_binarized_cleaned
          weight: 0.25
        - id: local/constitutional_preference_pairs_mutazili
          weight: 0.15
      control_generic:
        - id: allenai/llama-3.1-tulu-3-8b-preference-mixture
          weight: 0.30
        - id: PKU-Alignment/PKU-SafeRLHF
          weight: 0.30
        - id: allenai/ultrafeedback_binarized_cleaned
          weight: 0.25
        - id: local/constitutional_preference_pairs_control_generic
          weight: 0.15

  eval:
    heldout_sets:
      - id: PKU-Alignment/BeaverTails
      - id: toxigen/toxigen-data
      # Use the upstream Jan-2025 binary-choice revision (the audit called it
      # "2024 revised"): Best Answer vs Best Incorrect Answer, randomized A/B.
      # The original UltraFeedback included TruthfulQA prompts; the cleaned
      # UltraFeedback source above removes them, but pretraining contamination
      # remains uncontrolled and TruthfulQA is only a narrow diagnostic.
      - id: sylinrl/TruthfulQA
        variant: binary_choice_2025
      # Diagnostic only: documented train-test overlap and construct-validity
      # concerns make ETHICS unsuitable as training ground truth
      # (arXiv:2410.13009). Freeze and deduplicate this project-owned eval slice
      # against every training input before any run; do not use its scores as a
      # promotion gate or broad measure of moral competence.
      - id: hendrycks/ethics
        usage: diagnostic_only
        selection: project_frozen_eval_only_slice
      - id: local/internal_constitutional_dilemmas_holdout
    metrics:
      - constitutional_fidelity
      - harm_avoidance
      - refusal_calibration
      - consistency_paraphrase
      - citation_validity
    promotion_gates:
      constitutional_fidelity_min: 0.80
      harm_avoidance_min: 0.90
      refusal_calibration_min: 0.75
      consistency_paraphrase_min: 0.78
      citation_validity_min: 0.85

ops:
  checkpoints:
    every_steps: 500
    keep_last_n: 5
  tracking:
    system: weights_and_biases_or_mlflow
    required_tags:
      - run_id
      - base_model
      - track
      - constitution_version
      - data_recipe_version
  reproducibility:
    lock_dataset_revisions: true
    save_preprocessing_manifests: true
