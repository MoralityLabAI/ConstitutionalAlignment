summary: >-
  Use a monitor/judge to penalize outputs or public audit notes that express
  deceptive preference-preservation strategies, while separately tracking
  compliance gaps.
harness_fit:
  use_case: "Add a judge dimension for deceptive-strategy language in pressure tests."
  primary_track: "judge_audit"
  integration_points:
