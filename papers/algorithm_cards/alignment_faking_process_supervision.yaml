  files_to_touch:
    - "papers/algorithm_cards/alignment_faking_process_supervision.yaml"
evals:
  metrics:
    - "deceptive_strategy_language_rate"
    - "compliance_gap"
    - "monitor_precision"
    - "monitor_recall_on_manual_audit"
  minimum_viable_run: "Blind judge 100 pressure-test outputs and manually audit 30 positives/negatives."
guardrails:
  - "Do not collect or train on hidden chain-of-thought."
  - "Judge visible rationales, transcripts, and allowed audit notes only."
  - "Treat monitor outputs as noisy until manually calibrated."
notes: "Useful after the pressure suite exists; not a first-day SFT dependency."
